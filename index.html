<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonus Abuse Pattern Recognition — Risk Ops Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+Sinhala:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151a;
    --panel: #1a1e26;
    --panel-2: #20242e;
    --line: #2b303c;
    --text: #e7e6e1;
    --text-dim: #9aa0ac;
    --amber: #e0a53e;
    --amber-dim: #6b5a30;
    --red: #d9584f;
    --red-dim: #5a2e2b;
    --green: #6fbf8b;
    --mono: 'IBM Plex Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', 'Noto Sans Sinhala', 'Noto Sans Tamil', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    line-height: 1.6;
    padding-bottom: 90px;
  }
  a{color:inherit;}

  /* ---------- Lang switch ---------- */
  .langbar{
    position: sticky;
    top: 0;
    z-index: 50;
    display:flex;
    justify-content:flex-end;
    gap: 6px;
    padding: 12px 24px;
    background: rgba(18,21,26,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .lang-btn{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    background: var(--panel);
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all .18s ease;
  }
  .lang-btn:hover{ color: var(--text); border-color: var(--amber); }
  .lang-btn.active{
    background: var(--amber);
    color: #1a1305;
    border-color: var(--amber);
    font-weight: 600;
  }

  /* ---------- Header ---------- */
  header{
    border-bottom: 1px solid var(--line);
    padding: 40px 24px 32px;
    background: radial-gradient(ellipse 900px 300px at 15% 0%, rgba(224,165,62,0.08), transparent 60%);
  }
  .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 14px;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{
    content:"";
    width:7px; height:7px;
    background: var(--amber);
    border-radius: 50%;
    display:inline-block;
    box-shadow: 0 0 0 3px var(--amber-dim);
    animation: pulse-dot 2.4s ease-in-out infinite;
  }
  @keyframes pulse-dot{
    0%,100%{ box-shadow: 0 0 0 3px var(--amber-dim); }
    50%{ box-shadow: 0 0 0 6px transparent; }
  }
  h1{
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(26px, 4vw, 40px);
    letter-spacing: -0.01em;
    max-width: 820px;
  }
  .lede{
    margin-top: 14px;
    max-width: 680px;
    color: var(--text-dim);
    font-size: 15px;
  }
  .scope-box{
    margin-top: 26px;
    max-width: 820px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    background: var(--panel);
    padding: 16px 18px;
    font-size: 13.5px;
    color: var(--text-dim);
  }

  /* ---------- Nav ---------- */
  nav{
    max-width: 1060px;
    margin: 26px auto 0;
    padding: 0 24px;
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  nav a{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 7px 12px;
    border-radius: 3px;
    text-decoration: none;
    transition: border-color .15s, color .15s, transform .15s;
  }
  nav a:hover{ border-color: var(--amber); color: var(--amber); transform: translateY(-1px); }

  main{
    max-width: 1060px;
    margin: 40px auto 0;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ---------- Pattern accordion ---------- */
  .pattern{
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 8px;
    overflow: hidden;
    scroll-margin-top: 70px;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .pattern.in-view{ opacity: 1; transform: translateY(0); }

  .pattern-head{
    display:flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 22px;
    background: var(--panel-2);
    cursor: pointer;
    user-select: none;
  }
  .pattern-head:hover{ background: #242938; }
  .head-left{ display:flex; align-items:center; gap:16px; }
  .pattern-id{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--amber);
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .pattern-title{
    font-family: var(--display);
    font-weight: 600;
    font-size: 18px;
  }
  .head-right{ display:flex; align-items:center; gap: 14px; }
  .severity{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid var(--red-dim);
    color: var(--red);
    background: rgba(217,88,79,0.08);
  }
  .severity.med{ border-color: var(--amber-dim); color: var(--amber); background: rgba(224,165,62,0.08); }
  .chevron{
    width: 18px; height: 18px;
    flex-shrink:0;
    transition: transform .3s ease;
    color: var(--text-dim);
  }
  .pattern.open .chevron{ transform: rotate(180deg); color: var(--amber); }

  .pattern-body-wrap{
    max-height: 0;
    overflow: hidden;
    transition: max-height .4s ease;
  }
  .pattern.open .pattern-body-wrap{ max-height: 1200px; }

  .pattern-body{ padding: 22px 24px 26px; }
  .field{ margin-bottom: 18px; }
  .field:last-child{ margin-bottom: 0; }
  .field-label{
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
    display:flex; align-items:center; gap:8px;
  }
  .field-label .bar{ width:14px; height:1px; background: var(--line); }
  .definition{ font-size: 14.5px; color: var(--text); max-width: 720px; }

  .signals{ list-style:none; display:flex; flex-direction:column; gap:9px; }
  .signals li{
    font-size: 14px;
    color: var(--text);
    padding-left: 20px;
    position: relative;
    opacity: 0;
    transform: translateX(-6px);
  }
  .pattern.open .signals li{
    animation: slide-in .35s ease forwards;
  }
  .pattern.open .signals li:nth-child(1){ animation-delay: .05s; }
  .pattern.open .signals li:nth-child(2){ animation-delay: .1s; }
  .pattern.open .signals li:nth-child(3){ animation-delay: .15s; }
  .pattern.open .signals li:nth-child(4){ animation-delay: .2s; }
  .pattern.open .signals li:nth-child(5){ animation-delay: .25s; }
  @keyframes slide-in{ to{ opacity:1; transform: translateX(0); } }
  .signals li::before{
    content:"▸";
    position:absolute; left:0; top:0;
    color: var(--amber);
    font-size: 12px;
  }

  .escalation{
    font-size: 13.5px;
    color: var(--text-dim);
    border-left: 2px solid var(--red-dim);
    padding-left: 14px;
  }

  /* ---------- Chain diagram ---------- */
  .chain-section{
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 8px;
    padding: 26px 24px;
    scroll-margin-top: 70px;
  }
  .chain-flow{
    display:flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin: 20px 0 18px;
  }
  .chain-node{
    font-family: var(--mono);
    font-size: 12px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 13px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .chain-node.risk{ border-color: var(--red-dim); color: var(--red); }
  .chain-arrow{
    color: var(--amber);
    font-size: 15px;
    animation: arrow-pulse 1.8s ease-in-out infinite;
  }
  @keyframes arrow-pulse{
    0%,100%{ opacity: .45; transform: translateX(0); }
    50%{ opacity: 1; transform: translateX(3px); }
  }
  .chain-note{
    font-size: 13.5px;
    color: var(--text-dim);
    max-width: 760px;
    border-left: 2px solid var(--amber-dim);
    padding-left: 14px;
  }

  /* ---------- Quiz ---------- */
  .quiz-section{
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 8px;
    padding: 26px 24px 28px;
    scroll-margin-top: 70px;
  }
  .quiz-head{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px; margin-bottom: 22px; }
  .quiz-title{ font-family: var(--display); font-weight:600; font-size: 19px; }
  .quiz-score{
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--amber);
    border: 1px solid var(--amber-dim);
    padding: 6px 12px;
    border-radius: 20px;
  }
  .q-card{
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px 18px 20px;
    margin-bottom: 14px;
    background: var(--panel-2);
  }
  .q-prompt{ font-size: 14.5px; margin-bottom: 14px; }
  .q-options{ display:flex; flex-direction:column; gap:9px; }
  .q-option{
    text-align:left;
    font-family: var(--body);
    font-size: 13.5px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 11px 14px;
    border-radius: 5px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .q-option:hover:not(:disabled){ border-color: var(--amber); transform: translateX(2px); }
  .q-option:disabled{ cursor: default; }
  .q-option.correct{ border-color: var(--green); background: rgba(111,191,139,0.1); color: var(--green); }
  .q-option.wrong{ border-color: var(--red); background: rgba(217,88,79,0.1); color: var(--red); }
  .q-feedback{
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-dim);
    display:none;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .q-feedback.show{ display:block; animation: fade-in .3s ease; }
  @keyframes fade-in{ from{opacity:0;} to{opacity:1;} }

  footer{
    max-width: 1060px;
    margin: 40px auto 0;
    padding: 20px 24px 0;
    border-top: 1px solid var(--line);
    color: var(--text-dim);
    font-size: 12.5px;
  }

  @media (max-width: 640px){
    .pattern-title{ font-size: 15.5px; }
    .head-left{ gap: 10px; }
    .langbar{ justify-content: center; }
  }
</style>
</head>

<div class="langbar">
  <button class="lang-btn active" data-lang="en">EN</button>
  <button class="lang-btn" data-lang="si">සිංහල</button>

</nav>

<main id="main"></main>

<footer data-i18n="footer"></footer>

    </section>
  `;

  buildQuiz();
  buildToggles();
}

const quizData = [
  {id:'q1', promptKey:'q1p', opts:['q1a','q1b','q1c'], correct:1, fbKey:'q1fb'},
  {id:'q2', promptKey:'q2p', opts:['q2a','q2b','q2c'], correct:0, fbKey:'q2fb'},
  {id:'q3', promptKey:'q3p', opts:['q3a','q3b','q3c'], correct:1, fbKey:'q3fb'},
  {id:'q4', promptKey:'q4p', opts:['q4a','q4b','q4c'], correct:1, fbKey:'q4fb'}
];
let score = 0;
let answered = {};

function buildQuiz(){
  const list = document.getElementById('quizList');
  list.innerHTML = quizData.map(q => `
    <div class="q-card" data-qid="${q.id}">
      <div class="q-prompt" data-i18n="${q.promptKey}"></div>
      <div class="q-options">
        ${q.opts.map((ok,i) => `<button class="q-option" data-qid="${q.id}" data-idx="${i}" data-i18n="${ok}"></button>`).join('')}
      </div>
      <div class="q-feedback" data-fb="${q.id}"><span data-i18n="${q.fbKey}"></span></div>
    </div>
  `).join('');

  list.querySelectorAll('.q-option').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const qid = btn.dataset.qid;
      if(answered[qid]) return;
      const q = quizData.find(x=>x.id===qid);
      const idx = parseInt(btn.dataset.idx);
      const card = list.querySelector(`.q-card[data-qid="${qid}"]`);
      const allBtns = card.querySelectorAll('.q-option');
      allBtns.forEach(b=>b.disabled = true);
      if(idx === q.correct){
        btn.classList.add('correct');
        score++;
        document.getElementById('scoreVal').textContent = score;
      } else {
        btn.classList.add('wrong');
        allBtns[q.correct].classList.add('correct');
      }
      card.querySelector('.q-feedback').classList.add('show');
      answered[qid] = true;
    });
  });
}

function buildToggles(){
  document.querySelectorAll('[data-toggle]').forEach(head=>{
    head.addEventListener('click', ()=>{
      const section = document.getElementById(head.dataset.toggle);
      section.classList.toggle('open');
    });
  });
}

function applyLang(lang){
  currentLang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(T[lang][key] !== undefined) el.textContent = T[lang][key];
  });
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang === lang);
  });
}

document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> applyLang(btn.dataset.lang));
});

buildMain();
applyLang('en');

// scroll reveal
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting) e.target.classList.add('in-view');
  });
}, {threshold:0.1});
document.querySelectorAll('.pattern').forEach(p=>observer.observe(p));
</script>
